[package]
name = "railhead-swarm"
description = "Runs simulated agents, each a real `rh` process, against one Railhead repository."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
railhead-protocol.workspace = true

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "signal", "sync"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
# The `O_NOFOLLOW` flag clone files are opened with.
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
