name: Deploy

# Deploys the `railhead` Worker to its workers.dev host for qualification. Run by hand only; see
# docs/deploy.md. CI's Build and test job dry-runs the same deploy on every pull request.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy; it must resolve to a commit on main
        required: true
        default: main
        type: string

permissions:
  contents: read

# One deploy at a time. A running deploy is never cancelled; GitHub keeps at most one more pending,
# and a newer request replaces it.
concurrency:
  group: deploy-qualification
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to qualification
    runs-on: ubuntu-latest
    # Required reviewers, if the owner adds them, are configured on this environment, and its
    # secrets are only readable from here.
    environment:
      name: qualification
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 30
    steps:
      # Full history, so the next step can see main's.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      # The ref input is not the dispatch ref, so the environment's branch rules never see it. Only a
      # commit main has reached may run here: later steps run its code, and the deploy step hands
      # that code the secrets. Nothing from the checkout has run yet.
      - name: Require a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The ref does not resolve to a commit on main; only main's history is deployed"
            exit 1
          fi
          if [ ! -f scripts/write-worker-secrets.mjs ]; then
            echo "::error::The commit predates this deploy workflow; roll back to it with wrangler rollback instead"
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      # The same setup as ci.yml, except that a deploy restores no cache: it builds from the lockfile
      # alone, so a poisoned cache entry cannot reach the deployed Worker.
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: false
          run-install: true

      # The deploy reads the committed wrangler.jsonc, so it must match cloudflare.config.ts.
      - name: Check generated worker configs
        run: pnpm configs:check

      # Builds the board bundle the Worker serves as static assets.
      - name: Build
        run: pnpm build

      # The secrets go up with the version (`--secrets-file`) rather than through `wrangler secret
      # bulk` afterwards: the config declares them in `secrets.required`, and Wrangler 4.145 refuses
      # to create a Worker whose required secrets are not supplied with its first deploy. The file
      # holds exactly those names; the script fails, naming each one, when any secret below is empty.
      # Wrangler builds and pushes the sandbox image with the runner's Docker.
      - name: Deploy the Worker
        id: deploy
        working-directory: packages/railhead-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SIGNING_SECRET: ${{ secrets.SESSION_SIGNING_SECRET }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          node ../../scripts/write-worker-secrets.mjs --config wrangler.jsonc --out "$secrets_file" \
            --require CLOUDFLARE_API_TOKEN --require CLOUDFLARE_ACCOUNT_ID
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
          output="$WRANGLER_OUTPUT_FILE_PATH"
          version_id=$(jq -r 'select(.type == "deploy") | .version_id // empty' "$output" | tail -n 1)
          url=$(jq -r 'select(.type == "deploy") | .targets[]? | select(startswith("https://"))' "$output" | tail -n 1)
          if [ -z "$version_id" ] || [ -z "$url" ]; then
            echo "::error::Wrangler reported no version ID or URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed"
            echo
            echo "- Version ID: \`$version_id\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
